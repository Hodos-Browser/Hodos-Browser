# ============================================================
# PROMOTE RELEASE — manual "test-before-customers" gate
# ============================================================
# This workflow makes a verified DRAFT release public. It is the deliberate,
# human-triggered ship gate: release.yml builds + signs + crypto-verifies a
# DRAFT on a `v*` tag push and STOPS there. Nothing is public until the owner
# has installed and tested that exact draft on real hardware, then runs THIS
# workflow.
#
# It re-downloads the published draft bytes, optionally pins them to the digests
# the owner actually tested, re-asserts version/enclosure correctness, re-runs
# the SAME cryptographic signature verification — all BEFORE the irreversible
# flip — then flips to Latest and updates the website auto-update feed.
#
# A tag push can never reach a customer on its own — only this manual run can.
#
# ⚠️ WHO can promote = whoever has write access to this repo. The manual dispatch
# IS the gate; keep write access restricted to the release owner (this is the real
# "only I can publish" control, set in repo Settings → Collaborators). NEVER
# hand-publish a draft via the GitHub UI or `gh release edit` — that bypasses
# every check below.
name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing verified DRAFT tag to promote (e.g. v0.4.0)'
        required: true
        type: string
      expected_sha256sums:
        description: 'OPTIONAL but recommended: paste the draft''s SHA256SUMS.txt content to pin the exact bytes you tested. Leave blank to skip pinning (a warning is logged).'
        required: false
        type: string
      virustotal_report_url:
        description: 'VirusTotal report URL for THIS installer (https://www.virustotal.com/gui/file/<sha256>/detection). The hash in the URL is checked against the installer being promoted. Required unless av_seeding_waiver is set.'
        required: false
        type: string
      virustotal_detections:
        description: 'OPTIONAL: detection count off that report, e.g. "0/72". Recorded in the ledger row so we can track our false-positive noise floor across releases.'
        required: false
        type: string
      defender_submission_id:
        description: 'MS Defender submission ID (UUID from the WDSI portal / its confirmation email) proving this installer was seeded. Required unless av_seeding_waiver is set.'
        required: false
        type: string
      av_seeding_waiver:
        description: 'EMERGENCY ONLY: reason to promote WITHOUT AV seeding. Skips the seeding gate; the reason is logged loudly and written to the run summary.'
        required: false
        type: string
      farbling_rotation_token:
        description: 'The FARBLING-ROTATION-v1 line printed by development-docs/0.4.0/chromium-rebuild/farbling_seed_rotation_check.py, run on the build host against THIS build. Required unless farbling_gate_waiver is set. The gate re-derives every verdict from the hashes — it does not trust the token''s own verdict= field.'
        required: false
        type: string
      farbling_gate_waiver:
        description: 'Reason to promote WITHOUT the farbling seed-rotation gate. Expected for any M136 build, where farbling is inert by construction and the rotation cannot pass. Logged loudly and written to the run summary.'
        required: false
        type: string
      dry_run:
        description: 'REHEARSAL: run every check (incl. the AV seeding gate) against the real draft bytes, then STOP before the flip. Nothing is published, the website is not touched. Use this to prove the gate behaves before depending on it.'
        required: false
        default: false
        type: boolean

# Never let two promotes (or a promote + re-run) race the irreversible flip or
# the website push for the same tag.
concurrency:
  group: promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    # Pinned (kill silent drift): crypto-verify needs openssl >= 3 (Ed25519 -rawin).
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # needed to edit/promote the release

    steps:
      # Validate FIRST, via env-indirection — NEVER interpolate ${{ inputs.tag }}
      # into a run body (that executes at substitution time, before validation).
      - name: Validate tag input
        env:
          TAG_INPUT: ${{ inputs.tag }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Resolve dry_run to a plain string env var rather than gating steps on
          # the raw input. GitHub casts mismatched types when comparing a string
          # to a boolean in an `if:`, and a stringly-typed 'true' would compare
          # EQUAL to nothing and silently perform a REAL promote. Normalising here
          # (same env-indirection convention as TAG) removes that whole class of bug.
          case "${DRY_RUN_INPUT:-false}" in
            true|True|TRUE) echo "DRY_RUN=true"  >> "$GITHUB_ENV"
                            echo "::notice::DRY RUN — every check will run against the real draft bytes, then stop before the flip. Nothing will be published." ;;
            *)              echo "DRY_RUN=false" >> "$GITHUB_ENV" ;;
          esac
          TAG="$TAG_INPUT"
          # Accept only v<semver>[-beta.N] — no shell-metachar / path-traversal surface.
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' \
            || { echo "::error::tag '$TAG' is not a valid release tag (expected vX.Y.Z or vX.Y.Z-beta.N)"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          # Betas are currently a legitimate public release (deliberate); just make the
          # operator aware they're about to mark a beta as Latest on the public feed.
          case "$TAG" in
            *-beta.*) echo "::notice::Promoting a BETA tag ($TAG) to public Latest + feed." ;;
          esac

      # Pin the verifier + embedded public keys to the SOURCE that built this tag,
      # not HEAD. env.TAG is the validated value. `ref:` is an action input (not a
      # shell), so it cannot inject; a bad ref simply fails to check out.
      - name: Checkout the tag's source (verify script + embedded public keys)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Confirm the release exists (and detect draft vs already-public)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # Fail closed if the tag has no release. A draft is the normal case. An
          # already-public release is allowed ONLY as a recovery re-run (resume at
          # website-sync) — the flip step is skipped in that case.
          isDraft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null || echo "MISSING")
          case "$isDraft" in
            true)  echo "ALREADY_PUBLIC=false" >> "$GITHUB_ENV"; echo "OK: $TAG is a draft — eligible for promotion." ;;
            false) echo "ALREADY_PUBLIC=true"  >> "$GITHUB_ENV"; echo "::warning::$TAG is already public — running in RECOVERY mode (skip flip, re-sync website only)." ;;
            *)     echo "::error::no release found for tag $TAG (build it first via a tag push)."; exit 1 ;;
          esac

      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          mkdir -p artifacts
          # Pull the EXACT bytes that are published — these are what customers will get.
          gh release download "$TAG" --repo "$REPO" --dir artifacts --clobber
          echo "=== downloaded assets ==="; find artifacts -type f -printf '%p\t%s bytes\n'
          test -s "artifacts/appcast.xml" || { echo "::error::appcast.xml missing"; exit 1; }
          # The Windows silent client fetches <feed>.ed (the Ed25519 document-signature sidecar)
          # from the website and FAIL-CLOSES if it 404s. Refuse to promote a silent release whose
          # feed can't be signature-verified by the client.
          test -s "artifacts/appcast.xml.ed" || { echo "::error::appcast.xml.ed (feed signature sidecar) missing — the Windows silent client fail-closes without it"; exit 1; }
          test -s "artifacts/HodosBrowser-${VERSION}-setup.exe" || { echo "::error::Windows installer missing"; exit 1; }
          test -s "artifacts/HodosBrowser-${VERSION}.dmg"       || { echo "::error::macOS dmg missing"; exit 1; }

      # TOCTOU defense: assert the downloaded bytes hash-match the digests the owner
      # actually tested. If no digests were pasted, log a loud warning (not fatal).
      - name: Pin promoted bytes to the tested digests (if provided)
        env:
          EXPECTED_SUMS: ${{ inputs.expected_sha256sums }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SUMS//[[:space:]]/}" ]; then
            echo "::warning::No expected_sha256sums provided — promoting whatever is currently on the draft WITHOUT pinning to the tested bytes. Paste SHA256SUMS.txt next time."
            exit 0
          fi
          # SHA256SUMS.txt lines look like "<hash>  ./path/Name.ext". Compare by basename
          # so the path prefix from build time doesn't matter. Strip CR so a Windows-pasted
          # file (CRLF) doesn't corrupt the filename match.
          printf '%s\n' "$EXPECTED_SUMS" | tr -d '\r' | while read -r want path; do
            [ -n "$want" ] || continue
            base=$(basename "$path")
            file=$(find artifacts -type f -name "$base" -print -quit)
            [ -n "$file" ] || { echo "::error::expected file '$base' not found among downloaded assets"; exit 1; }
            got=$(sha256sum "$file" | awk '{print $1}')
            [ "$got" = "$want" ] || { echo "::error::digest mismatch for $base: tested=$want published=$got — bytes changed since you tested. Refusing."; exit 1; }
            echo "pinned OK: $base ($want)"
          done

      # Port release.yml's draft-time appcast assertions so promote's pre-flip gate
      # is a SUPERSET, not a subset: version + both enclosures must match THIS tag.
      - name: Verify appcast advertises this exact version + enclosures (pre-flip)
        run: |
          set -euo pipefail
          AC="artifacts/appcast.xml"
          V_ESC="${VERSION//./\\.}"
          grep -qE "<sparkle:shortVersionString>${V_ESC}</sparkle:shortVersionString>" "$AC" \
            || { echo "::error::appcast shortVersionString is not ${VERSION}"; exit 1; }
          grep -qF -- "HodosBrowser-${VERSION}-setup.exe" "$AC" || { echo "::error::appcast missing Windows enclosure for ${VERSION}"; exit 1; }
          grep -qF -- "HodosBrowser-${VERSION}.dmg"       "$AC" || { echo "::error::appcast missing macOS enclosure for ${VERSION}"; exit 1; }
          grep -qE 'sparkle:dsaSignature="[^"]+"' "$AC" || { echo "::error::Windows enclosure has no DSA signature"; exit 1; }
          grep -qE 'sparkle:edSignature="[^"]+"'  "$AC" || { echo "::error::macOS enclosure has no EdDSA signature"; exit 1; }
          echo "Appcast pre-flip check OK for ${VERSION}."

      # Same fail-closed verifier release.yml ran at draft time, re-run against the
      # PUBLISHED bytes so a tampered/swapped asset can never be promoted. Includes
      # the built-in mutation self-test (corrupted sig MUST fail).
      - name: Cryptographically re-verify the published bytes (fail-closed)
        run: |
          set -euo pipefail
          ver=$(openssl version | awk '{print $2}')
          case "$ver" in 3.*|4.*|5.*) echo "openssl $ver OK" ;; *) echo "::error::openssl $ver too old (need >= 3.x for Ed25519 -rawin)"; exit 1 ;; esac
          python3 scripts/verify_update_signatures.py \
            --appcast "artifacts/appcast.xml" \
            --windows-installer "artifacts/HodosBrowser-${VERSION}-setup.exe" \
            --macos-dmg "artifacts/HodosBrowser-${VERSION}.dmg" \
            --autoupdater-src cef-native/src/core/AutoUpdater.cpp \
            --info-plist cef-native/Info.plist

      # ============================================================
      # AV / SMARTSCREEN SEEDING GATE
      # ============================================================
      # Plan + rationale: development-docs/DevOps-CICD/AV_SEEDING_GATE_PLAN.md
      # Process being enforced: BUILD_AND_RELEASE.md §2.5 (Step 8 of the checklist).
      #
      # WHY: SmartScreen reputation is keyed on file-hash + cert-thumbprint and only
      # accrues from real installs. Seeding (VirusTotal + an MS Defender "software
      # developer" submission) is well documented and historically skipped —
      # beta.16–27 have no record at all; beta.28 was seeded and never promoted while
      # beta.29 was promoted and never seeded. Nothing connected "going public" to
      # "was seeded". This gate does.
      #
      # WHERE: after the crypto re-verify (bytes downloaded + pinned, so the hash is
      # the real one) and BEFORE the irreversible flip, so a miss blocks publication
      # instead of being discovered afterwards.
      #
      # BOTH HALVES ARE ATTESTATION — neither vendor is queried:
      #   - VirusTotal's free API forbids use "in business workflows, commercial
      #     products or services" (their own wording on the API-key page). Hodos is
      #     a commercial product, and VT Enterprise cannot be justified for one
      #     lookup per release. So we do NOT call the API.
      #   - MS Defender submission has no public status API at all (the M365
      #     Defender one needs a corporate tenant we don't have).
      #
      # What we CAN check is that the evidence the operator pastes refers to THIS
      # build: the SHA-256 embedded in the VirusTotal report URL must equal the
      # hash of the installer about to be published. That catches the realistic
      # mistake — a stale URL from the previous release — without touching the API.
      #
      # A fabricated Defender UUID still passes. Deliberate: the threat model is
      # FORGETTING, not lying.
      #
      # Skipped entirely in recovery mode — the flip already happened.
      - name: AV seeding gate — waiver check
        if: env.ALREADY_PUBLIC != 'true'
        env:
          WAIVER: ${{ inputs.av_seeding_waiver }}
        run: |
          set -euo pipefail
          if [ -n "${WAIVER//[[:space:]]/}" ]; then
            echo "AV_SEEDING_WAIVED=true" >> "$GITHUB_ENV"
            echo "::warning::AV seeding WAIVED for ${TAG} — reason: ${WAIVER}"
            {
              echo "### ⚠️ AV seeding WAIVED"
              echo ""
              echo "**Tag:** \`${TAG}\`"
              echo "**Reason:** ${WAIVER}"
              echo ""
              echo "Promoted **without** VirusTotal / MS Defender seeding. Seed manually as soon"
              echo "as possible (\`BUILD_AND_RELEASE.md\` §2.5) and record the row in §2.5.2."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "AV_SEEDING_WAIVED=false" >> "$GITHUB_ENV"
          fi

      - name: AV seeding gate — VirusTotal report (hash-checked attestation)
        if: env.ALREADY_PUBLIC != 'true' && env.AV_SEEDING_WAIVED != 'true'
        env:
          VT_REPORT_URL: ${{ inputs.virustotal_report_url }}
          VT_DETECTIONS_IN: ${{ inputs.virustotal_detections }}
        run: |
          set -euo pipefail
          EXE="artifacts/HodosBrowser-${VERSION}-setup.exe"
          SHA=$(sha256sum "$EXE" | awk '{print $1}')
          echo "VT_SHA=$SHA" >> "$GITHUB_ENV"
          echo "installer sha256: $SHA"

          URL="${VT_REPORT_URL//[[:space:]]/}"
          if [ -z "$URL" ]; then
            echo "::error::No VirusTotal report URL provided — this installer has not been scanned."
            echo "::error::Upload HodosBrowser-${VERSION}-setup.exe (raw .exe, NOT zipped) at https://www.virustotal.com/, then paste the report URL and re-run."
            echo "::error::Emergency override: re-run with av_seeding_waiver set to a reason."
            exit 1
          fi

          echo "$URL" | grep -qiE '^https://(www\.)?virustotal\.com/gui/file/' \
            || { echo "::error::'${URL}' is not a VirusTotal report URL (expected https://www.virustotal.com/gui/file/<sha256>...)."; exit 1; }

          # Every VT report URL embeds the file hash. Extract the sha256 and prove
          # the report is about the bytes we are seconds away from publishing.
          URL_SHA=$(printf '%s' "$URL" | grep -oiE '[0-9a-f]{64}' | head -n1 | tr '[:upper:]' '[:lower:]' || true)
          if [ -z "$URL_SHA" ]; then
            echo "::error::No SHA-256 found in that URL. VirusTotal also serves md5/sha1-keyed report URLs — open the report, copy the sha256 from its Details tab, and use the /gui/file/<sha256> form."
            exit 1
          fi
          if [ "$URL_SHA" != "$SHA" ]; then
            echo "::error::That VirusTotal report is for a DIFFERENT file."
            echo "::error::  report URL hash : ${URL_SHA}"
            echo "::error::  installer hash  : ${SHA}"
            echo "::error::Most likely a stale URL from a previous release. Scan THIS installer and paste its report URL."
            exit 1
          fi

          {
            echo "VT_URL=$URL"
            echo "VT_STATUS=attested"
            echo "VT_DETECTIONS=${VT_DETECTIONS_IN//[[:space:]]/}"
          } >> "$GITHUB_ENV"
          echo "VirusTotal report hash matches this installer — ${URL}"
          # No automated detection-count block: reading the count is a human step
          # now (the operator is already on the report page to copy this URL).
          if [ -n "${VT_DETECTIONS_IN//[[:space:]]/}" ]; then
            echo "operator-reported detections: ${VT_DETECTIONS_IN}"
          fi

      # ATTESTATION, not verification — see the block comment above. We can only
      # check the shape of the ID, never that it is real.
      - name: AV seeding gate — MS Defender submission (attested)
        if: env.ALREADY_PUBLIC != 'true' && env.AV_SEEDING_WAIVED != 'true'
        env:
          DEFENDER_ID: ${{ inputs.defender_submission_id }}
        run: |
          set -euo pipefail
          ID="${DEFENDER_ID//[[:space:]]/}"
          if [ -z "$ID" ]; then
            echo "::error::No MS Defender submission ID provided — this installer has not been seeded."
            echo "::error::Submit HodosBrowser-${VERSION}-setup.exe at https://www.microsoft.com/en-us/wdsi/filesubmission (submission type: 'Software developer'), then re-run with the ID it returns."
            echo "::error::Emergency override: re-run with av_seeding_waiver set to a reason."
            exit 1
          fi
          echo "$ID" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
            || { echo "::error::'${ID}' is not a valid submission ID (expected a UUID from the WDSI portal or its confirmation email)."; exit 1; }
          echo "DEFENDER_ID_OK=$ID" >> "$GITHUB_ENV"
          echo "MS Defender submission ID recorded: $ID"

      # Emits the §2.5.2 ledger row pre-formatted for paste. Phase 2 of the plan
      # appends this to BUILD_AND_RELEASE.md automatically.
      - name: AV seeding gate — emit §2.5.2 ledger row
        if: env.ALREADY_PUBLIC != 'true' && env.AV_SEEDING_WAIVED != 'true'
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          {
            echo "### AV seeding — ledger row for \`BUILD_AND_RELEASE.md\` §2.5.2"
            echo ""
            echo '```markdown'
            echo "**${VERSION} submission record:**"
            echo "- Cert chain: <run the §2.5.1 PowerShell check on Windows and paste the intermediate CA + leaf thumbprint>"
            echo "- Installer SHA-256: \`${VT_SHA}\`"
            if [ "${VT_STATUS:-}" = "attested" ]; then
              if [ -n "${VT_DETECTIONS:-}" ]; then
                echo "- VirusTotal: submitted ${TODAY} — **${VT_DETECTIONS}** — ${VT_URL}"
              else
                echo "- VirusTotal: submitted ${TODAY} — <detections, e.g. 0/72> — ${VT_URL}"
              fi
            else
              echo "- VirusTotal: NOT RECORDED — **VERIFY MANUALLY**"
            fi
            echo "- MS Defender: submitted ${TODAY}, ID \`${DEFENDER_ID_OK}\` (status: Submitted — reconcile to Completed later)"
            echo "- Norton: skipped (submit only on a real detection)"
            echo '```'
            echo ""
            echo "Paste into \`development-docs/DevOps-CICD/BUILD_AND_RELEASE.md\` §2.5.2."
            echo "_Phase 2 of \`AV_SEEDING_GATE_PLAN.md\` will append this automatically._"
          } >> "$GITHUB_STEP_SUMMARY"

      # =====================================================================
      # FARBLING SEED-ROTATION GATE
      #
      # WHY THIS IS A PROMOTE GATE AND NOT A CI JOB.
      #
      # ⚠️ CORRECTED 2026-08-15. This block used to say a hosted job "would
      # compile against binaries with no farbling and go red against correct
      # code", because the org repo's asset predated the C2/C3 patches. THAT
      # PREMISE DIED when release.yml moved to the versioned P4f assets
      # (cef-binaries-{windows,macos}-150.0.43-g9ccef04): both arms now build
      # against binaries carrying the full C1-C6 + P4e + P4f patch set, so a
      # hosted job would NOT be testing a farbling-free browser.
      #
      # The CONCLUSION still holds, for different and more durable reasons:
      # this gate drives a real browser through profile edits and full
      # RESTARTS, comparing farbled values across sessions. It needs a
      # persistent profile directory, a GPU-backed renderer for the WebGL
      # vector, and several minutes of browser lifecycle — none of which a
      # hosted runner gives us cheaply or reliably. The measurement therefore
      # runs on the build host, and the result is carried here.
      #
      # ⛔ Recorded rather than silently rewritten because a STALE RATIONALE is
      # how this project has repeatedly talked itself into the wrong thing. If
      # someone later reads the old reason, checks it, finds it false, and
      # concludes the gate can move to CI, they would be right about the reason
      # and wrong about the gate.
      #
      # WHY IT EXISTS AT ALL. Fingerprint farbling shipped broken in EVERY
      # release from beta.1 to beta.29 — the renderer never received its seed
      # and fell back to a URL hash, making the "randomised" fingerprint a
      # per-URL constant identical across all users, i.e. a browser-identifying
      # tag rather than a defence. It survived because the bug is invisible to
      # any single-session check, and every check anyone ran was single-session.
      # Brave shipped the same class themselves (#49346). The durable artifact
      # is this cross-session test, so it gets a gate.
      #
      # ⭐ UNLIKE THE DEFENDER ATTESTATION ABOVE, THIS IS VERIFIED, NOT TRUSTED.
      # The token carries the raw hashes and the engine string, and the steps
      # below re-derive all four contracts from them. `verdict=` is ignored on
      # purpose: a token that says PASS but whose hashes say otherwise fails.
      # =====================================================================
      - name: Farbling gate — waiver check
        if: env.ALREADY_PUBLIC != 'true'
        env:
          WAIVER: ${{ inputs.farbling_gate_waiver }}
        run: |
          set -euo pipefail
          if [ -n "${WAIVER//[[:space:]]/}" ]; then
            echo "FARBLING_GATE_WAIVED=true" >> "$GITHUB_ENV"
            echo "::warning::Farbling seed-rotation gate WAIVED for ${TAG} — reason: ${WAIVER}"
            {
              echo "### ⚠️ Farbling seed-rotation gate WAIVED"
              echo ""
              echo "**Tag:** \`${TAG}\`"
              echo "**Reason:** ${WAIVER}"
              echo ""
              echo "Promoted **without** proving per-user fingerprint unlinkability. Expected on"
              echo "any M136 build, where farbling is inert by construction and the fail-closed"
              echo "path is the intended behaviour — see"
              echo "\`development-docs/TICKET_farbling_constant_seed_shipped.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FARBLING_GATE_WAIVED=false" >> "$GITHUB_ENV"
          fi

      - name: Farbling gate — re-derive the seed-rotation verdict
        if: env.ALREADY_PUBLIC != 'true' && env.FARBLING_GATE_WAIVED != 'true'
        env:
          TOKEN: ${{ inputs.farbling_rotation_token }}
        run: |
          set -euo pipefail
          T="${TOKEN}"
          if [ -z "${T//[[:space:]]/}" ]; then
            echo "::error::No farbling rotation token provided — per-user fingerprint unlinkability has not been proven for this build."
            echo "::error::On the build host, with the dev stack running:"
            echo "::error::  python development-docs/0.4.0/chromium-rebuild/farbling_seed_rotation_check.py --exe <build>/HodosBrowser.exe --profile-dir <profile> --port 9322 --dev"
            echo "::error::then paste the FARBLING-ROTATION-v1 line it prints."
            echo "::error::Waiver: re-run with farbling_gate_waiver set to a reason (expected for M136 builds)."
            exit 1
          fi

          case "$T" in
            FARBLING-ROTATION-v1\ *) ;;
            *) echo "::error::Not a FARBLING-ROTATION-v1 token: ${T}"; exit 1 ;;
          esac

          field() { printf '%s' "$T" | grep -oE "(^| )$1=[^ ]+" | head -n1 | cut -d= -f2- ; }
          ENGINE=$(field engine)
          EXEMPT=$(field exempt)
          LARGE=$(field large)
          FARBLED=$(field farbled)
          [ -n "$ENGINE" ] && [ -n "$EXEMPT" ] && [ -n "$LARGE" ] && [ -n "$FARBLED" ] \
            || { echo "::error::Token is missing one of engine/exempt/large/farbled: ${T}"; exit 1; }

          # Bind the result to an engine that can actually farble. On M136 the patches
          # do not exist, so a rotation "result" from one is meaningless — and without
          # this check a token pasted from the wrong build would look identical.
          MAJOR=$(printf '%s' "$ENGINE" | grep -oE '[0-9]+' | head -n1 || true)
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 150 ]; then
            echo "::error::Token reports engine '${ENGINE}'. Native farbling requires the CEF 150 fork; a rotation result from an older engine proves nothing."
            echo "::error::If this really is an M136 build, use farbling_gate_waiver instead."
            exit 1
          fi

          split() { printf '%s' "$1" | tr '/' ' ' ; }
          read -r EX_A EX_B EX_C <<< "$(split "$EXEMPT")"
          read -r LG_A LG_B LG_C <<< "$(split "$LARGE")"
          read -r FA_A FA_B FA_C <<< "$(split "$FARBLED")"
          for v in "$EX_A" "$EX_B" "$EX_C" "$LG_A" "$LG_B" "$LG_C" "$FA_A" "$FA_B" "$FA_C"; do
            printf '%s' "$v" | grep -qE '^[0-9a-f]{8}$' \
              || { echo "::error::'${v}' is not an 8-hex-digit hash — token malformed."; exit 1; }
          done

          fail=0
          # CONTROL 1 — the auth-exempt page is never farbled, so it must not move.
          # If it does, the runs are not comparable and nothing below means anything.
          if [ "$EX_A" != "$EX_B" ] || [ "$EX_B" != "$EX_C" ]; then
            echo "::error::CONTROL FAILED: auth-exempt hash moved across runs (${EXEMPT}). The measurements are not comparable."
            fail=1
          fi
          # CONTROL 2 — the >=65536px canvas is outside the farbling gate.
          if [ "$LG_A" != "$LG_B" ] || [ "$LG_B" != "$LG_C" ]; then
            echo "::error::CONTROL FAILED: large-canvas hash moved across runs (${LARGE}). Rendering differed between runs; the farbled delta cannot be attributed to the seed."
            fail=1
          fi
          # THE assertion the shipped bug fails, and the only one that catches its class.
          if [ "$FA_A" = "$FA_B" ]; then
            echo "::error::UNLINKABILITY FAILED: rotating profileSeed did not change the farbled value (${FA_A}). The fingerprint does not depend on the seed — that is the constant-seed class. DO NOT PROMOTE."
            fail=1
          fi
          # Determinism across restarts — the login guarantee.
          if [ "$FA_A" != "$FA_C" ]; then
            echo "::error::DETERMINISM FAILED: restoring seed A gave ${FA_C}, not ${FA_A}. The fingerprint is unstable across restarts, which reads to sites as a new device on every launch."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

          echo "farbling seed-rotation verdict re-derived and holds (engine ${ENGINE})"
          {
            echo "### ✅ Farbling seed-rotation gate"
            echo ""
            echo "| | seed A | seed B | seed A again |"
            echo "|---|---|---|---|"
            echo "| exempt (control) | \`${EX_A}\` | \`${EX_B}\` | \`${EX_C}\` |"
            echo "| large canvas (control) | \`${LG_A}\` | \`${LG_B}\` | \`${LG_C}\` |"
            echo "| **farbled** | \`${FA_A}\` | **\`${FA_B}\`** | **\`${FA_C}\`** |"
            echo ""
            echo "Engine \`${ENGINE}\`. Controls held still, seed B changed the fingerprint,"
            echo "and seed A round-tripped exactly — per-user unlinkability **and** determinism"
            echo "across restarts, from one experiment."
          } >> "$GITHUB_STEP_SUMMARY"

      # Point of no return — assets become public + Latest. Skipped in recovery mode
      # (already public) so a re-run resumes at website-sync without re-flipping.
      - name: Promote release to live (latest)
        if: env.ALREADY_PUBLIC != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --draft=false --prerelease=false --latest
          echo "Release $TAG is now LIVE and marked Latest."

      - name: Verify public download URLs resolve
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          for f in "HodosBrowser-${VERSION}-setup.exe" "HodosBrowser-${VERSION}.dmg"; do
            ok=0
            for i in $(seq 1 15); do
              code=$(curl -sS -o /dev/null -L -w "%{http_code}" "${BASE}/${f}" || echo "000")
              [ "$code" = "200" ] && { ok=1; echo "public OK: ${f}"; break; }
              echo "waiting on public ${f} (HTTP $code) [$i/15]"; sleep 8
            done
            [ "$ok" = "1" ] || { echo "ERROR: ${f} not publicly downloadable after promote"; exit 1; }
          done

      # Update the website repo: the auto-update feed (public/appcast.xml), the
      # download-button targets (public/_redirects), and the version shown on the
      # page (src/pages/index.astro). Cloudflare Pages auto-deploys on push to main.
      # Idempotent (git diff --cached --quiet) so recovery re-runs are safe.
      - name: Update website (appcast + downloads + version)
        if: env.DRY_RUN != 'true'
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          [ -n "${WEBSITE_TOKEN:-}" ] || { echo "ERROR: WEBSITE_DEPLOY_TOKEN secret is not set"; exit 1; }
          case "$VERSION" in *[!0-9A-Za-z.-]*) echo "ERROR: unexpected chars in version '$VERSION'"; exit 1;; esac

          # Public repo — clone without credentials; auth is applied only on the push.
          git clone --depth 1 "https://github.com/${OWNER}/hodosbrowser.com.git" website-repo
          cd website-repo
          { test -f public/_redirects && test -f src/pages/index.astro; } || { echo "ERROR: website layout not as expected"; exit 1; }

          # 0) Byte-stability: the detached appcast.xml.ed signature is over the EXACT appcast.xml
          #    bytes. Stop git from normalizing line endings on these files — a CRLF flip would
          #    break the signature and fail-close every Windows silent client. Idempotent; the
          #    per-file `-text` rule overrides any repo-wide `* text=auto`.
          touch .gitattributes
          grep -qxF 'public/appcast.xml -text'    .gitattributes || echo 'public/appcast.xml -text'    >> .gitattributes
          grep -qxF 'public/appcast.xml.ed -text' .gitattributes || echo 'public/appcast.xml.ed -text' >> .gitattributes

          # 1) appcast.xml + its Ed25519 document-signature sidecar (appcast.xml.ed) — copy the
          #    already-verified published feed verbatim. The Windows silent client fetches
          #    <feed>.ed from the website and fail-closes without it, so BOTH must be served.
          test -s ../artifacts/appcast.xml    || { echo "ERROR: artifacts/appcast.xml missing/empty"; exit 1; }
          test -s ../artifacts/appcast.xml.ed || { echo "ERROR: artifacts/appcast.xml.ed missing/empty"; exit 1; }
          cp ../artifacts/appcast.xml    public/appcast.xml
          cp ../artifacts/appcast.xml.ed public/appcast.xml.ed

          # 2) _redirects — rewrite the two download lines deterministically from VERSION/TAG
          BASE="https://github.com/${OWNER}/Hodos-Browser/releases/download/${TAG}"
          {
            printf '/download/win  %s/HodosBrowser-%s-setup.exe  302\n' "$BASE" "$VERSION"
            printf '/download/mac  %s/HodosBrowser-%s.dmg  302\n'       "$BASE" "$VERSION"
          } > public/_redirects

          # 3) index.astro — bump the displayed version (tolerant of spacing); assert exactly one decl
          sed -i -E "s/(const +version *= *\")[^\"]*(\")/\1${VERSION}\2/" src/pages/index.astro
          n=$(grep -cE "const +version *= *\"${VERSION//./\\.}\"" src/pages/index.astro || true)
          [ "$n" = "1" ] || { echo "ERROR: expected exactly 1 version decl in index.astro, found $n"; exit 1; }

          # Exact-match sanity (grep -F: version is a literal, never a regex/substring)
          grep -qF -- "HodosBrowser-${VERSION}-setup.exe" public/_redirects || { echo "ERROR: _redirects win line not bumped"; exit 1; }
          grep -qF -- "HodosBrowser-${VERSION}.dmg"       public/_redirects || { echo "ERROR: _redirects mac line not bumped"; exit 1; }
          [ "$(grep -c '^/download/' public/_redirects)" = "2" ] || { echo "ERROR: _redirects route count drifted"; exit 1; }

          git config user.name "hodos-release-bot"
          git config user.email "release-bot@hodosbrowser.com"
          git add .gitattributes public/appcast.xml public/appcast.xml.ed public/_redirects src/pages/index.astro
          if git diff --cached --quiet; then
            echo "Website already at ${VERSION} (idempotent re-run) — nothing to push."
          else
            git commit -m "Release ${VERSION}: appcast + download links + version"
            # Auth via per-command header (not in the clone URL or .git/config). Mask the
            # base64 so it can never surface in logs even though it isn't the raw secret.
            AUTH_B64=$(printf 'x-access-token:%s' "$WEBSITE_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::${AUTH_B64}"
            pushed=0
            for i in 1 2 3; do
              if git -c http.extraheader="AUTHORIZATION: basic ${AUTH_B64}" push origin HEAD:main; then pushed=1; break; fi
              echo "push rejected (concurrent update on main?) — rebasing, attempt ${i}/3"
              git fetch origin main && git rebase origin/main || { echo "ERROR: rebase conflict on website repo"; exit 1; }
            done
            [ "$pushed" = "1" ] || { echo "ERROR: website push failed after retries"; exit 1; }
          fi

      - name: Verify website is live with new version
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          WIN_EXE="HodosBrowser-${VERSION}-setup.exe"
          MAC_DMG="HodosBrowser-${VERSION}.dmg"
          # Verify the appcast AND BOTH download redirects in ONE retry loop. Cloudflare
          # propagates appcast.xml and _redirects with a few seconds' skew, so checking the
          # redirects only once (right after the appcast catches up) false-failed even though
          # the deploy was fine (the beta.23 promote). Retry all three together; only declare
          # success when the whole website state is consistent.
          ok=0; winloc=""; macloc=""
          for i in $(seq 1 30); do
            # cache-bust so we read origin, not a stale Cloudflare edge copy
            live=$(curl -sS -m 20 -H 'Cache-Control: no-cache' "https://hodosbrowser.com/appcast.xml?cb=${GITHUB_SHA}-${i}" \
                   | grep -oE '<sparkle:shortVersionString>[^<]+' | sed 's/.*>//' || true)
            winloc=$(curl -sS -m 20 -o /dev/null -w "%{redirect_url}" -H 'Cache-Control: no-cache' "https://hodosbrowser.com/download/win?cb=${GITHUB_SHA}-${i}" || true)
            macloc=$(curl -sS -m 20 -o /dev/null -w "%{redirect_url}" -H 'Cache-Control: no-cache' "https://hodosbrowser.com/download/mac?cb=${GITHUB_SHA}-${i}" || true)
            appcast_ok=0; echo "$live"   | grep -qxF "$VERSION" && appcast_ok=1
            win_ok=0;     echo "$winloc" | grep -qF -- "$WIN_EXE" && win_ok=1
            mac_ok=0;     echo "$macloc" | grep -qF -- "$MAC_DMG" && mac_ok=1
            if [ "$appcast_ok" = 1 ] && [ "$win_ok" = 1 ] && [ "$mac_ok" = 1 ]; then
              ok=1; echo "live: appcast + /download/win + /download/mac all serving ${VERSION}"; break
            fi
            echo "not fully live yet [${i}/30] — appcast=${appcast_ok}(saw ${live:-none}) win=${win_ok} mac=${mac_ok}; retrying"; sleep 15
          done
          [ "$ok" = "1" ] || { echo "ERROR: website not fully serving ${VERSION} (appcast + both download redirects) after deploy window"; exit 1; }
          echo "/download/win -> ${winloc}"
          echo "/download/mac -> ${macloc}"
          echo "Website verified live for ${VERSION}. Promotion complete."

      # The Windows silent client fail-closes on the appcast document signature. Verify the
      # SERVED appcast.xml.ed against the SERVED appcast.xml bytes with the SAME embedded key
      # the client uses — the only thing that catches a CRLF/normalization/edge-transform that
      # slipped past the .gitattributes guard. Fail-closed: a broken feed signature bricks
      # silent for the whole fleet, so refuse to consider the promotion complete.
      - name: Verify served appcast.xml.ed signature (byte-stability guard)
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          ver=$(openssl version | awk '{print $2}')
          case "$ver" in 3.*|4.*|5.*) : ;; *) echo "::error::openssl $ver too old (need >= 3.x for Ed25519 -rawin)"; exit 1 ;; esac
          # Embedded SUPublicEDKey (raw 32-byte Ed25519). Build a public-key PEM: SPKI DER
          # prefix (302a300506032b6570032100) || the 32 raw bytes -> DER -> base64 -> PEM.
          PUB="GVq3mpDl8eelsG0A5wqC5FBYZd3fy7U3we9iZ9+Tq3Q="
          { printf '302a300506032b6570032100'; printf '%s' "$PUB" | base64 -d | xxd -p -c 999; } \
            | xxd -r -p | openssl base64 > /tmp/pub.b64
          { echo "-----BEGIN PUBLIC KEY-----"; cat /tmp/pub.b64; echo "-----END PUBLIC KEY-----"; } > /tmp/appcast_pub.pem
          ok=0
          for i in $(seq 1 20); do
            # Per-iteration cache-bust so a stale/partial edge copy can't get pinned under a
            # constant key for the whole retry window.
            curl -sS -m 20 -H 'Cache-Control: no-cache' "https://hodosbrowser.com/appcast.xml?cb=${GITHUB_SHA}-${i}"    -o /tmp/served.xml || true
            curl -sS -m 20 -H 'Cache-Control: no-cache' "https://hodosbrowser.com/appcast.xml.ed?cb=${GITHUB_SHA}-${i}" -o /tmp/served.ed  || true
            if [ -s /tmp/served.xml ] && [ -s /tmp/served.ed ]; then
              { printf 'hodos-appcast-v1\n'; cat /tmp/served.xml; } > /tmp/msg.bin
              if openssl base64 -d -A -in /tmp/served.ed -out /tmp/sig.bin 2>/dev/null \
                 && openssl pkeyutl -verify -rawin -pubin -inkey /tmp/appcast_pub.pem -in /tmp/msg.bin -sigfile /tmp/sig.bin >/dev/null 2>&1; then
                ok=1; echo "served appcast.xml.ed verifies against the served appcast.xml bytes ✓"; break
              fi
            fi
            echo "served .ed not verifying yet [${i}/20] (edge cache warming, or a normalization slipped in?)"; sleep 15
          done
          [ "$ok" = "1" ] || { echo "::error::served appcast.xml.ed does NOT verify against the served appcast.xml — a CRLF/normalization/edge transform broke the feed signature; every Windows silent client would fail-closed. Investigate before this build reaches silent users."; exit 1; }

      # Closes a rehearsal by stating plainly what did and did not happen, so a
      # green dry run is never mistaken for a completed promotion.
      - name: Dry run — what did NOT happen
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          {
            echo "## 🧪 DRY RUN — nothing was published"
            echo ""
            echo "Every pre-flip check ran against the real draft bytes of \`${TAG}\`:"
            echo "asset presence, digest pinning, appcast assertions, cryptographic"
            echo "signature re-verification, and the AV seeding gate."
            echo ""
            echo "**Skipped (rehearsal only):**"
            echo "- the release was NOT flipped to public / Latest"
            echo "- the website (appcast, download links, version) was NOT touched"
            echo "- no public-URL or served-signature verification ran"
            echo ""
            echo "\`${TAG}\` is still a draft. Re-run with **dry_run unchecked** to promote for real."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DRY RUN complete — ${TAG} is still a draft. Nothing was published."
