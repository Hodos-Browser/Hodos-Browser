# PR gate (Track E) — runs the reusable test workflow on pull requests and on
# the integration branches by calling .github/workflows/test.yml.
#
# Once this is green on PRs, set it as a REQUIRED status check in branch
# protection so failing tests block merge. (See development-docs/DevOps-CICD/TESTING.md.)
#
# Triggers note: the active sprint branch 0.4.0 is already covered by test.yml's
# own temporary `push: branches: [0.4.0]` trigger, so it is NOT listed here (avoids
# double runs). Remove that temporary trigger when 0.4.0 merges and this becomes
# the canonical gate.

name: ci

on:
  pull_request:
  # main ONLY, not [main, staging] (trimmed 2026-08-17 — Actions quota).
  #
  # Release propagation is a single command that pushes the SAME commit to both:
  #   git push origin HEAD:staging HEAD:main
  # With both branches listed that fired this workflow TWICE per propagation, for
  # an identical tree — pure duplicate spend, and the dev fork's minutes are
  # metered (the org's are free). main is the blessed release-candidate branch, so
  # gating it is what actually matters; staging always carries the same commit by
  # the time it matters.
  #
  # ⚠️ Consequence to accept knowingly: a push that lands on staging WITHOUT also
  # landing on main is no longer gated here. Today nothing does that — Step 2 of
  # BUILD_AND_RELEASE.md always pushes both together. If that flow ever changes,
  # put staging back.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
